[project]
name = "stacks-mcp"
version = "0.1.0"
description = "Read-only Bitcoin and Stacks MCP server: balances, history and plain-English transaction explanations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pete Watters", email = "2938440+pete-watters@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = ["mcp", "bitcoin", "stacks", "sbtc", "blockchain", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/pete-watters/stacks-mcp"
Repository = "https://github.com/pete-watters/stacks-mcp"
Issues = "https://github.com/pete-watters/stacks-mcp/issues"

[project.scripts]
stacks-mcp = "stacks_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stacks_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
